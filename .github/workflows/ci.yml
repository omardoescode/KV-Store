name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang-format clang-tidy cmake pkg-config libssl-dev zlib1g-dev valgrind

      - name: Format check
        run: make format-check

      - name: Build
        run: make -j"$(nproc)"

      - name: Lint
        run: make lint TIDYFLAGS="--warnings-as-errors=*"

      - name: Memory check
        run: make memcheck

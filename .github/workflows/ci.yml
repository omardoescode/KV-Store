name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LLVM_VERSION: 23
  CLANG_FORMAT: clang-format-23
  CLANG_TIDY: clang-tidy-23

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-${LLVM_VERSION} clang-tidy-${LLVM_VERSION} g++ cmake pkg-config libssl-dev zlib1g-dev libsqlite3-dev sqlite3 valgrind

      - name: Format check
        run: make format-check

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make test

      - name: Lint
        run: make lint TIDYFLAGS="--warnings-as-errors=*"

      - name: Memory check
        run: make memcheck

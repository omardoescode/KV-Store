name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LLVM_VERSION: 23
  CLANG_FORMAT: clang-format-23
  CLANG_TIDY: clang-tidy-23

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${LLVM_VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-${LLVM_VERSION} clang-tidy-${LLVM_VERSION} g++ cmake pkg-config libssl-dev zlib1g-dev libsqlite3-dev sqlite3 valgrind

      # The key is the h2o commit and its build recipe in the Makefile, not the whole Makefile.
      - name: h2o commit
        id: h2o
        run: |
          echo "sha=$(git rev-parse HEAD:third_party/h2o)" >> "$GITHUB_OUTPUT"
          echo "recipe=$(sed -n '/^\$(H2O_LIB):/,/^$/p' Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: h2o-cache
        with:
          path: build/h2o
          key: h2o-${{ runner.os }}-${{ steps.h2o.outputs.sha }}-${{ steps.h2o.outputs.recipe }}

      # The checkout makes h2o's CMakeLists.txt newer than the cached library, so make would build it again.
      - name: Keep cached h2o
        if: steps.h2o-cache.outputs.cache-hit == 'true'
        run: touch build/h2o/libh2o-evloop.a

      - name: Format check
        run: make format-check

      - name: Build
        run: make -j"$(nproc)"

      - name: Test
        run: make test

      - name: Lint
        run: make lint TIDYFLAGS="--warnings-as-errors=*"

      - name: Memory check
        run: make memcheck

  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The runner image usually has these already; apt-get update alone takes about 20 s.
      - name: Install tools
        run: |
          pkgs="g++ cmake pkg-config libssl-dev zlib1g-dev libsqlite3-dev sqlite3 curl"
          dpkg -s $pkgs >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y $pkgs; }

      # The key is the h2o commit and its build recipe in the Makefile, not the whole Makefile.
      - name: h2o commit
        id: h2o
        run: |
          echo "sha=$(git rev-parse HEAD:third_party/h2o)" >> "$GITHUB_OUTPUT"
          echo "recipe=$(sed -n '/^\$(H2O_LIB):/,/^$/p' Makefile | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: h2o-cache
        with:
          path: build/h2o
          key: h2o-${{ runner.os }}-${{ steps.h2o.outputs.sha }}-${{ steps.h2o.outputs.recipe }}

      # The checkout makes h2o's CMakeLists.txt newer than the cached library, so make would build it again.
      - name: Keep cached h2o
        if: steps.h2o-cache.outputs.cache-hit == 'true'
        run: touch build/h2o/libh2o-evloop.a

      - name: Build
        run: make -j"$(nproc)" build/app build/kv-cp-proc

      - name: E2E tests
        run: make test-e2e E2E_SHARD=${{ matrix.shard }}/4
